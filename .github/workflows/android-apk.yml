name: Android APK
on:
  push:
    branches:
      - "feature/versao-2-completa"
      - "feature/backup-restauracao-2-4"
    paths:
      - "CallBlocker-Pro/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p CallBlocker-Pro :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CallBlockerPro-2.4-debug
          path: CallBlocker-Pro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
