name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o CallBlocker-Pro-final.zip -d .
          test -f CallBlocker-Pro/settings.gradle.kts
          test -f CallBlocker-Pro/app/build.gradle.kts

      - name: Align Java and Kotlin targets
        working-directory: CallBlocker-Pro/app
        run: |
          cat >> build.gradle.kts <<'EOF'

          // Keep Java and Kotlin bytecode targets consistent for CI builds.
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: CallBlocker-Pro
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CallBlocker-Pro-debug
          path: CallBlocker-Pro/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
